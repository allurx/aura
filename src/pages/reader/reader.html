<div id="reader">
    <button
        id="reading-tools-entry"
        class="reader-tools-entry"
        type="button"
        aria-controls="header footer"
        aria-expanded="false"
        aria-label="显示阅读工具"
        title="显示阅读工具"
        hidden
    >
        显示阅读工具
    </button>
    <header id="header" aria-hidden="true" inert>
        <h1 id="chapter-title"></h1>
    </header>

    <main id="content" tabindex="0" aria-label="阅读正文"></main>

    <nav id="reader-actions" aria-label="阅读操作" hidden>
        <div class="reader-tools-heading">
            <button
                class="reader-tools-drag icon-button"
                type="button"
                aria-label="移动阅读工具"
                title="拖动可移动位置，方向键微调"
            >
                <span class="icon" aria-hidden="true"></span>
            </button>
        </div>
        <div id="reader-tools-body" class="reader-tools-body panel-scroll">
            <div class="reader-action-group navigation-actions" role="group" aria-label="阅读工具"></div>
            <div class="reader-action-group page-actions" role="group" aria-label="页面操作"></div>
        </div>
        <button
            class="reader-tools-toggle icon-button"
            type="button"
            aria-label="收起阅读工具"
            title="收起阅读工具"
            aria-expanded="true"
            aria-controls="reader-tools-body"
        >
            <span class="icon" aria-hidden="true"></span>
        </button>
    </nav>

    <footer id="footer" aria-hidden="true" inert>
        <div class="reading-status" role="group" aria-label="阅读位置">
            <span id="page-position" title="当前章节页码" role="status" aria-atomic="true" hidden>
                <span class="page-label">本章</span>
                <span class="page-count">
                    <span class="current-page">—</span>
                    <span class="page-separator">/</span>
                    <span class="total-pages">—</span>
                </span>
            </span>
            <span class="reading-progress">
                <span class="progress-label">全书</span>
                <span id="progress-rate" title="全书阅读进度">—</span>
            </span>
        </div>
        <nav class="mobile-actions" aria-label="阅读操作">
            <button
                id="toggle-toc-panel"
                disabled
                class="reader-action"
                type="button"
                aria-label="打开目录"
                title="打开目录"
                aria-controls="toc"
                aria-expanded="false"
                aria-haspopup="dialog"
            >
                <span class="icon icon-table-of-contents" aria-hidden="true"></span><span>目录</span>
            </button>
            <button
                id="toggle-setting-panel"
                disabled
                class="reader-action"
                type="button"
                aria-label="阅读设置"
                title="阅读设置"
                aria-controls="setting"
                aria-expanded="false"
                aria-haspopup="dialog"
            >
                <span class="appearance-mark" aria-hidden="true">Aa</span><span>设置</span>
            </button>
            <button id="return-bookshelf" class="reader-action" type="button" aria-label="返回书架" title="返回书架">
                <span class="icon icon-bookshelf" aria-hidden="true"></span><span>书架</span>
            </button>
            <button
                id="toggle-fullscreen"
                disabled
                class="reader-action"
                type="button"
                aria-label="进入全屏"
                aria-pressed="false"
                title="进入全屏"
            >
                <span class="icon icon-fullscreen" aria-hidden="true"></span><span>全屏</span>
            </button>
        </nav>
    </footer>

    <dialog id="toc" aria-labelledby="toc-title" tabindex="-1" inert>
        <header>
            <div class="toc-heading">
                <h2 id="toc-title">目录</h2>
                <p id="toc-summary" class="toc-summary" role="status" aria-atomic="true"></p>
            </div>
            <div class="toc-actions" role="group" aria-label="目录操作">
                <button
                    class="locate-current icon-button"
                    type="button"
                    aria-label="定位当前章节"
                    aria-controls="toc-chapters"
                    title="定位当前章节"
                >
                    <span class="icon" aria-hidden="true"></span>
                </button>
                <span class="toc-action-divider" aria-hidden="true"></span>
                <button
                    class="close icon-button icon-button-edge-right"
                    type="button"
                    aria-label="关闭目录"
                    title="关闭目录"
                    autofocus
                >
                    <span class="icon icon-close" aria-hidden="true"></span>
                </button>
            </div>
        </header>
        <div class="toc-tools">
            <form class="search-field toc-search" role="search" aria-label="搜索章节">
                <label>
                    <span class="icon icon-search" aria-hidden="true"></span>
                    <input
                        id="toc-search"
                        type="search"
                        aria-label="查找章节"
                        aria-controls="toc-chapters"
                        aria-describedby="toc-summary"
                        placeholder="查找章节"
                        autocomplete="off"
                        spellcheck="false"
                        enterkeyhint="search"
                    />
                </label>
            </form>
        </div>
        <nav id="toc-chapters" class="main panel-scroll" aria-label="章节列表">
            <p class="toc-empty" role="status" hidden>未找到匹配章节</p>
        </nav>
    </dialog>
</div>
