<div id="reader">
    <button
        id="reading-tools-entry"
        class="reader-tools-entry"
        type="button"
        aria-controls="header footer"
        aria-expanded="false"
        aria-label="显示阅读工具"
        title="显示阅读工具"
        hidden
    >
        显示阅读工具
    </button>
    <header id="header">
        <h1 id="book-title"></h1>
    </header>

    <main id="content" class="panel-scroll" tabindex="0" aria-label="阅读正文"></main>

    <nav id="reader-actions" class="panel-scroll" aria-label="阅读操作" hidden>
        <div class="reader-action-group navigation-actions" role="group" aria-label="章节导航">
            <button id="previous-chapter" class="reader-action" type="button" aria-keyshortcuts="ArrowLeft">
                <span class="icon icon-arrow-left" aria-hidden="true"></span><span>上一章</span>
            </button>
            <button id="next-chapter" class="reader-action" type="button" aria-keyshortcuts="ArrowRight">
                <span class="icon icon-arrow-right" aria-hidden="true"></span><span>下一章</span>
            </button>
        </div>
        <div class="reader-action-group preference-actions" role="group" aria-label="阅读外观与全屏"></div>
        <div class="reader-action-group bookshelf-actions" role="group" aria-label="返回书架"></div>
    </nav>

    <footer id="footer">
        <div class="reading-location">
            <div id="chapter-title"></div>
            <div id="progress-rate" title="全书阅读进度"></div>
        </div>
        <nav class="mobile-actions" aria-label="阅读操作">
            <button
                id="toggle-toc-panel"
                class="reader-action"
                type="button"
                aria-label="打开目录"
                aria-controls="toc"
                aria-expanded="false"
            >
                <span class="icon icon-table-of-contents" aria-hidden="true"></span><span>目录</span>
            </button>
            <button
                id="toggle-setting-panel"
                class="reader-action"
                type="button"
                aria-label="阅读外观"
                aria-controls="setting"
                aria-expanded="false"
            >
                <span class="appearance-mark" aria-hidden="true">Aa</span><span>外观</span>
            </button>
            <button
                id="toggle-fullscreen"
                class="reader-action"
                type="button"
                aria-label="进入全屏"
                aria-pressed="false"
                title="进入全屏"
            >
                <span class="icon icon-fullscreen" aria-hidden="true"></span><span>全屏</span>
            </button>
            <button id="return-bookshelf" class="reader-action" type="button" aria-label="返回书架">
                <span class="icon icon-bookshelf" aria-hidden="true"></span><span>书架</span>
            </button>
        </nav>
    </footer>

    <dialog id="toc" class="panel-scroll" aria-labelledby="toc-title" tabindex="-1">
        <header>
            <div class="toc-heading">
                <h2 id="toc-title">目录</h2>
                <p class="toc-summary" aria-live="polite"></p>
            </div>
            <button class="close icon-button" type="button" aria-label="关闭目录" title="关闭" autofocus>
                <span class="icon icon-close" aria-hidden="true"></span>
            </button>
        </header>
        <div class="toc-tools">
            <button class="locate-current" type="button" aria-label="定位当前章节">
                <span class="toc-current-heading"><span>正在阅读</span><span>定位</span></span>
                <span class="toc-current-title"></span>
            </button>
            <label class="toc-search">
                <span class="icon icon-search" aria-hidden="true"></span>
                <input id="toc-search" type="search" aria-label="查找章节" placeholder="查找章节" autocomplete="off" />
            </label>
        </div>
        <nav class="main panel-scroll" aria-label="章节列表">
            <p class="toc-empty" role="status" hidden>没有找到匹配的章节</p>
        </nav>
    </dialog>
</div>
