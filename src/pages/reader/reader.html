<div id="reader">
    <button
        id="reading-tools-entry"
        class="reader-tools-entry"
        type="button"
        aria-controls="header footer"
        aria-expanded="false"
        aria-label="显示阅读工具"
        title="显示阅读工具"
        hidden
    >
        显示阅读工具
    </button>
    <header id="header" aria-hidden="true" inert>
        <h1 id="book-title"></h1>
    </header>

    <main id="content" tabindex="0" aria-label="阅读正文"></main>

    <nav id="reader-actions" class="panel-scroll" aria-label="阅读操作" hidden>
        <div class="reader-action-group navigation-actions" role="group" aria-label="阅读导航">
            <button
                id="previous-page"
                class="reader-action"
                type="button"
                aria-keyshortcuts="ArrowLeft PageUp Shift+Space"
            >
                <span class="icon icon-arrow-left" aria-hidden="true"></span><span>上一页</span>
            </button>
            <button id="next-page" class="reader-action" type="button" aria-keyshortcuts="ArrowRight PageDown Space">
                <span class="icon icon-arrow-right" aria-hidden="true"></span><span>下一页</span>
            </button>
        </div>
        <div class="reader-action-group preference-actions" role="group" aria-label="阅读设置与全屏"></div>
        <div class="reader-action-group bookshelf-actions" role="group" aria-label="返回书架"></div>
    </nav>

    <footer id="footer" aria-hidden="true" inert>
        <nav class="mobile-page-navigation" aria-label="阅读翻页">
            <div class="reading-location">
                <div id="chapter-title"></div>
                <div class="reading-status">
                    <span id="page-position" title="当前章节页码" role="status" aria-atomic="true" hidden>
                        <span>本章</span><span class="page-count"></span>
                    </span>
                    <span id="progress-rate" title="全书阅读进度"></span>
                </div>
            </div>
        </nav>
        <nav class="mobile-actions" aria-label="阅读操作">
            <button
                id="toggle-toc-panel"
                class="reader-action"
                type="button"
                aria-label="打开目录"
                aria-controls="toc"
                aria-expanded="false"
                aria-haspopup="dialog"
            >
                <span class="icon icon-table-of-contents" aria-hidden="true"></span><span>目录</span>
            </button>
            <button
                id="toggle-setting-panel"
                class="reader-action"
                type="button"
                aria-label="阅读设置"
                title="阅读设置"
                aria-controls="setting"
                aria-expanded="false"
                aria-haspopup="dialog"
            >
                <span class="appearance-mark" aria-hidden="true">Aa</span><span>设置</span>
            </button>
            <button
                id="toggle-fullscreen"
                class="reader-action"
                type="button"
                aria-label="进入全屏"
                aria-pressed="false"
                title="进入全屏"
            >
                <span class="icon icon-fullscreen" aria-hidden="true"></span><span>全屏</span>
            </button>
            <button id="return-bookshelf" class="reader-action" type="button" aria-label="返回书架">
                <span class="icon icon-bookshelf" aria-hidden="true"></span><span>书架</span>
            </button>
        </nav>
    </footer>

    <dialog id="toc" aria-labelledby="toc-title" tabindex="-1" inert>
        <header>
            <div class="toc-heading">
                <h2 id="toc-title">目录</h2>
                <p id="toc-summary" class="toc-summary" role="status" aria-atomic="true"></p>
            </div>
            <div class="toc-actions" role="group" aria-label="目录操作">
                <button
                    class="locate-current icon-button"
                    type="button"
                    aria-label="定位当前章节"
                    aria-controls="toc-chapters"
                    title="定位当前章节"
                >
                    <span class="icon" aria-hidden="true"></span>
                </button>
                <span class="toc-action-divider" aria-hidden="true"></span>
                <button
                    class="close icon-button icon-button-edge-right"
                    type="button"
                    aria-label="关闭目录"
                    title="关闭目录"
                    autofocus
                >
                    <span class="icon icon-close" aria-hidden="true"></span>
                </button>
            </div>
        </header>
        <div class="toc-tools">
            <label class="search-field toc-search">
                <span class="icon icon-search" aria-hidden="true"></span>
                <input
                    id="toc-search"
                    type="search"
                    aria-label="查找章节"
                    aria-controls="toc-chapters"
                    aria-describedby="toc-summary"
                    placeholder="查找章节"
                    autocomplete="off"
                    spellcheck="false"
                    enterkeyhint="search"
                />
            </label>
        </div>
        <nav id="toc-chapters" class="main panel-scroll" aria-label="章节列表">
            <p class="toc-empty" role="status" hidden>没有找到匹配的章节</p>
        </nav>
    </dialog>
</div>
