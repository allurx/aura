<div id="bookshelf">
    <dialog id="bookshelf-sidebar" aria-label="书架导航" open>
        <div id="nav" class="panel-scroll">
            <div class="brand">
                <span class="icon icon-book" aria-hidden="true"></span>
                <span class="brand-name">Aura</span>
                <button id="close-navigation" class="icon-button" type="button" aria-label="关闭导航">
                    <span class="icon icon-close" aria-hidden="true"></span>
                </button>
            </div>
            <nav id="category-navigation" class="panel-scroll" aria-label="书籍分类"></nav>
            <div class="nav-footer">
                <button id="open-help" type="button">
                    <span class="icon icon-help" aria-hidden="true"></span>阅读帮助
                </button>
                <button id="clear-btn" type="button">
                    <span class="icon icon-delete" aria-hidden="true"></span>清空书架
                </button>
            </div>
        </div>
    </dialog>
    <main aria-label="书架" tabindex="-1">
        <header id="header">
            <div class="shelf-heading">
                <button
                    id="open-navigation"
                    class="icon-button"
                    type="button"
                    aria-label="打开导航"
                    aria-controls="bookshelf-sidebar"
                    aria-expanded="false"
                >
                    <span class="icon icon-menu" aria-hidden="true"></span>
                </button>
                <h1 id="category-title">全部书籍</h1>
                <span id="book-count" aria-live="polite"></span>
            </div>
            <div class="shelf-tools">
                <label class="book-search-field">
                    <span class="icon icon-search" aria-hidden="true"></span>
                    <input
                        id="book-search"
                        type="search"
                        placeholder="搜索书名"
                        aria-label="搜索当前分类中的书名"
                        autocomplete="off"
                    />
                </label>
                <button
                    id="toggle-setting-panel"
                    class="appearance-button"
                    type="button"
                    aria-controls="setting"
                    aria-expanded="false"
                    aria-label="外观"
                    title="外观"
                >
                    <span class="icon icon-setting" aria-hidden="true"></span><span class="appearance-label">外观</span>
                </button>
                <button id="import-books" type="button" aria-label="导入 TXT" title="导入 TXT">
                    <span class="icon icon-add" aria-hidden="true"></span><span class="import-label">导入 TXT</span>
                </button>
                <input id="book-input" type="file" accept=".txt" multiple hidden />
            </div>
        </header>
        <section id="book-list" class="panel-scroll" aria-label="书籍列表" tabindex="-1"></section>
        <p id="shelf-feedback" role="status" aria-live="polite" hidden></p>
    </main>
</div>
