<div id="bookshelf">
    <dialog id="bookshelf-sidebar" aria-label="书架导航" open>
        <div id="nav">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">Aura</span>
                <button id="close-navigation" class="icon-button" type="button" aria-label="关闭导航">
                    <span class="icon icon-close" aria-hidden="true"></span>
                </button>
            </div>
            <nav id="category-navigation" class="panel-scroll" aria-label="书籍分类"></nav>
            <div class="nav-footer">
                <button id="open-more" type="button" popovertarget="bookshelf-more-actions">管理与帮助</button>
                <div
                    id="bookshelf-more-actions"
                    class="panel-scroll"
                    popover="auto"
                    role="group"
                    aria-label="管理与帮助"
                >
                    <button id="open-about" type="button" aria-haspopup="dialog" aria-controls="about-dialog" autofocus>
                        <span class="icon icon-about" aria-hidden="true"></span>关于 Aura
                    </button>
                    <div class="data-actions" role="group" aria-label="数据操作">
                        <button id="clear-btn" type="button" aria-haspopup="dialog">
                            <span class="icon icon-delete" aria-hidden="true"></span>清空书架
                        </button>
                        <button id="reset-data" type="button" aria-haspopup="dialog">
                            <span class="icon icon-reset" aria-hidden="true"></span>重置全部数据
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </dialog>
    <main aria-label="书架" tabindex="-1">
        <header id="header">
            <div class="shelf-heading">
                <button
                    id="open-navigation"
                    class="icon-button"
                    type="button"
                    aria-label="打开导航"
                    aria-controls="bookshelf-sidebar"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                >
                    <span class="icon icon-menu" aria-hidden="true"></span>
                </button>
                <div class="shelf-heading-text">
                    <h1 id="category-title">全部书籍</h1>
                    <span id="book-count" role="status" aria-atomic="true"></span>
                </div>
            </div>
            <div class="shelf-tools">
                <label class="search-field book-search-field">
                    <span class="icon icon-search" aria-hidden="true"></span>
                    <input
                        id="book-search"
                        type="search"
                        placeholder="搜索书名"
                        aria-label="搜索当前分类中的书名"
                        aria-controls="book-list"
                        aria-describedby="book-count"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        enterkeyhint="search"
                    />
                </label>
                <button
                    id="toggle-setting-panel"
                    class="appearance-button"
                    type="button"
                    aria-controls="setting"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                    aria-label="外观"
                    title="外观"
                >
                    <span class="icon icon-setting" aria-hidden="true"></span><span class="appearance-label">外观</span>
                </button>
                <button id="import-books" type="button" aria-label="导入书籍" title="导入 TXT、EPUB">
                    <span class="icon icon-add" aria-hidden="true"></span><span class="import-label">导入</span>
                </button>
                <input id="book-input" type="file" multiple hidden />
            </div>
        </header>
        <section id="book-list" class="panel-scroll" aria-label="书籍列表" tabindex="-1"></section>
        <p id="shelf-feedback" role="status" aria-atomic="true" hidden></p>
    </main>
</div>
