<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <title>Aura</title>
        <meta
            name="description"
            content="Aura 是一个轻量、离线优先的 TXT 阅读器，支持本地导入、书架分类与搜索、章节导航、阅读进度恢复和主题排版设置。书籍与阅读进度保存在当前浏览器本地。"
        />
        <meta name="application-name" content="Aura" />
        <meta name="author" content="allurx" />
        <!-- 标签图标采用小尺寸专用轮廓；显式内联让 portable 保持单文件，无需等待应用脚本执行。 -->
        <link rel="icon" href="./assets/images/favicon.svg?inline" type="image/svg+xml" sizes="any" />

        <script>
            // 在样式加载前同步恢复页面主题，避免首次绘制闪现默认配色。
            (() => {
                const page =
                    window.location.hash === "#/reader" && sessionStorage.getItem("aura.router.reader.bookId")
                        ? "reader"
                        : "bookshelf";
                const appearance = JSON.parse(localStorage.getItem(`aura.${page}.appearance`) ?? "{}");
                const theme = appearance.theme ?? "sunny";
                Object.assign(document.documentElement.dataset, { page, theme });
            })();
        </script>
        <link rel="stylesheet" href="./styles/appearance-preference.css" />
        <link rel="stylesheet" href="./pages/bookshelf/bookshelf.css" />
        <link rel="stylesheet" href="./pages/reader/reader.css" />
        <script src="./main.ts" type="module"></script>
    </head>
    <body>
        <div id="app"></div>
        <dialog id="about-dialog" class="dialog license-dialog" aria-labelledby="about-title">
            <header class="header">
                <h2 id="about-title" class="title">关于 Aura</h2>
                <form method="dialog">
                    <button class="close-btn icon-button" type="submit" aria-label="关闭关于 Aura" autofocus>
                        <span class="icon icon-close" aria-hidden="true"></span>
                    </button>
                </form>
            </header>
            <section class="body panel-scroll" tabindex="0" aria-label="项目介绍与开源许可">
                <section class="license-project" aria-labelledby="license-project-name">
                    <div class="license-project-heading">
                        <span class="license-brand" aria-hidden="true"></span>
                        <div>
                            <h3 id="license-project-name">Aura</h3>
                            <p>轻量、离线优先的 TXT 阅读器</p>
                        </div>
                    </div>
                    <div class="license-project-links">
                        <a href="https://github.com/allurx/aura" target="_blank" rel="noopener noreferrer">
                            <span class="icon icon-source-code" aria-hidden="true"></span>项目源码
                            <span class="icon icon-external-link" aria-hidden="true"></span>
                        </a>
                        <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank" rel="noopener noreferrer">
                            Apache 2.0<span class="icon icon-external-link" aria-hidden="true"></span>
                        </a>
                    </div>
                    <details class="license-disclosure">
                        <summary>查看项目许可证<span class="icon icon-chevron" aria-hidden="true"></span></summary>
                        <pre id="aura-license">__AURA_LICENSE_TEXT__</pre>
                    </details>
                </section>
                <div class="license-section-heading">
                    <h3>第三方组件</h3>
                    <p>感谢这些开源项目。</p>
                </div>
                <div id="third-party-notices">__AURA_THIRD_PARTY_NOTICES__</div>
                <p class="license-footnote">完整声明随应用保存，展开即可离线阅读。</p>
            </section>
        </dialog>
    </body>
</html>
