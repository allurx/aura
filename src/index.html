<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
        />
        <title>Aura - 轻量、离线优先的 TXT 和 EPUB 阅读器</title>
        <meta
            name="description"
            content="Aura 是一个轻量、离线优先的电子书阅读器，可导入 TXT 和 EPUB，提供本地书架、章节导航、阅读进度恢复和原文件导出。书籍与阅读进度保存在当前浏览器本地。"
        />
        <meta name="application-name" content="Aura" />
        <meta name="author" content="allurx" />
        <link rel="icon" href="./assets/images/favicon.svg?inline" type="image/svg+xml" sizes="any" />
        <script>
            // 在样式加载前同步恢复页面主题，避免首次绘制闪现默认配色。
            (() => {
                const root = document.documentElement;
                Object.assign(root.dataset, { page: "bookshelf", theme: "sunny" });
                try {
                    const page =
                        window.location.hash === "#/reader" && sessionStorage.getItem("aura.router.reader.bookId")
                            ? "reader"
                            : "bookshelf";
                    root.dataset.page = page;
                    root.dataset.theme = page === "reader" ? "paper" : "sunny";
                    const appearance = JSON.parse(localStorage.getItem(`aura.${page}.appearance`) ?? "{}");
                    if (typeof appearance?.theme === "string") root.dataset.theme = appearance.theme;
                } catch {
                    // 与外观仓库一致：读取受限或快照损坏时保留默认主题，不阻断首屏。
                }
            })();
        </script>
        <link rel="stylesheet" href="./styles/app.css" />
        <script src="./main.ts" type="module"></script>
    </head>
    <body>
        <div id="app">
            <noscript>
                <p style="padding: 1.5rem; color: var(--appearance-color); line-height: 1.7">
                    Aura 是一个轻量的本地 TXT 和 EPUB 阅读器。<br />
                    请启用 JavaScript 后导入书籍并开始阅读。
                </p>
            </noscript>
        </div>
        <dialog id="about-dialog" class="dialog license-dialog" aria-labelledby="about-title" inert>
            <header class="header">
                <h2 id="about-title" class="title">关于 Aura</h2>
                <form method="dialog">
                    <button class="close-btn icon-button" type="submit" aria-label="关闭关于 Aura" autofocus>
                        <span class="icon icon-close" aria-hidden="true"></span>
                    </button>
                </form>
            </header>
            <section class="body panel-scroll" tabindex="0" aria-label="项目介绍与开源许可">
                <section class="license-project" aria-labelledby="license-project-name">
                    <div class="license-project-heading">
                        <span class="license-brand" aria-hidden="true"></span>
                        <div class="license-project-title">
                            <h3 id="license-project-name">Aura</h3>
                            <span class="license-version" title="当前版本">v__AURA_VERSION__</span>
                        </div>
                    </div>
                    <div class="license-project-links">
                        <a
                            href="https://github.com/allurx/aura/releases/latest"
                            target="_blank"
                            rel="noopener noreferrer"
                            title="前往 GitHub 最新发布页下载离线版"
                        >
                            离线版下载
                            <span class="icon icon-external-link" aria-hidden="true"></span>
                        </a>
                        <a href="https://github.com/allurx/aura" target="_blank" rel="noopener noreferrer">
                            项目源码
                            <span class="icon icon-external-link" aria-hidden="true"></span>
                        </a>
                        <button id="copy-qq-group" type="button" data-qq-group="1038423789" title="复制 QQ 交流群号">
                            QQ 交流群
                            <span class="icon icon-copy" aria-hidden="true"></span>
                        </button>
                    </div>
                </section>
                <section class="license-section" aria-labelledby="license-section-title">
                    <h3 id="license-section-title" class="license-section-heading">许可与致谢</h3>
                    <div class="license-item">
                        <details class="license-disclosure">
                            <summary>
                                <span class="icon icon-chevron" aria-hidden="true"></span>
                                <span class="license-item-heading">项目许可证</span>
                                <span class="license-badge">Apache-2.0</span>
                            </summary>
                            <div class="license-document">
                                <pre id="aura-license">__AURA_LICENSE_TEXT__</pre>
                            </div>
                        </details>
                    </div>
                    <div id="third-party-notices">__AURA_THIRD_PARTY_NOTICES__</div>
                </section>
            </section>
        </dialog>
    </body>
</html>
