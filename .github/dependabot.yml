version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      groups:
          routine-updates:
              update-types:
                  - "minor"
                  - "patch"
              exclude-patterns:
                  - "allurx/web-foundation*"
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      groups:
          routine-updates:
              update-types:
                  - "minor"
                  - "patch"
              exclude-patterns:
                  - "@allurx/web-foundation"
