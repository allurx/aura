name: Reader diagnostic

on:
    push:
        branches: [dev]
        paths:
            - ".github/workflows/reader-diagnostic.yml"
            - "tests/reader-progress.test.ts"
            - "tests/reader-diagnostics.ts"
            - "tests/reader-event-trace.ts"
            - "tests/browser-test-support.ts"
            - "src/pages/reader/content/**"

permissions:
    contents: read

concurrency:
    group: reader-diagnostic-${{ github.ref }}
    cancel-in-progress: true

jobs:
    reproduce:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                scenario: [4, 8]
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build both deliveries
              run: |
                  npm run build
                  npm run build:portable
            - name: Capture environment and reproduce original assertion
              shell: bash
              env:
                  AURA_READER_CPU_RATE: ${{ matrix.scenario }}
              run: |
                  set -euo pipefail
                  mkdir -p work/reader-ci-diagnostics
                  {
                      node --version
                      google-chrome --version
                      fc-list
                  } > work/reader-ci-diagnostics/environment.txt
                  run_tests() {
                      node --test --test-name-pattern='EPUB links to empty tail anchors' tests/reader-progress.test.ts
                  }
                  for attempt in $(seq 1 4); do
                      if run_tests 2>&1 | tee "work/reader-ci-diagnostics/attempt-$attempt.log"; then
                          continue
                      fi
                      exit 1
                  done
            - name: Upload diagnostic evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: reader-diagnostics-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: work/reader-ci-diagnostics/
                  retention-days: 7
                  if-no-files-found: warn
