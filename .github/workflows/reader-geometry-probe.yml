name: Reader geometry probe

on:
    push:
        branches: [dev]
        paths:
            - ".github/workflows/reader-geometry-probe.yml"
            - "tests/reader-diagnostic-probe.ts"

permissions:
    contents: read

jobs:
    probe:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Install dependencies and build Web
              run: |
                  npm ci
                  npm run build
            - name: Scan native scroll geometry with the original assertion
              run: node tests/reader-diagnostic-probe.ts
            - name: Upload probe evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: reader-geometry-${{ github.run_id }}
                  path: work/reader-font-probe/
                  retention-days: 7
                  if-no-files-found: warn
