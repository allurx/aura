name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - dev

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/web-foundation/.github/workflows/static-site.yml@main
        secrets: inherit
        with:
            asset-directory: dist/web/
            production-url: https://aura.allurx.io

    dependabot-merge:
        needs: site
        permissions:
            contents: write
            pull-requests: write
        uses: allurx/web-foundation/.github/workflows/dependabot-merge.yml@main
        with:
            target-branch: dev
