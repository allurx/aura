name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - dev

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/allurx-build/.github/workflows/cloudflare-static-site.yml@71684ece317c5344be9f5dae18f2512c88bc56b1 # v1.0.0
        secrets: inherit
        with:
            asset-directory: dist/web/
            production-url: https://aura.allurx.io
