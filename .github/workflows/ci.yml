name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - dev

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/web-foundation/.github/workflows/static-site.yml@v1.0.1
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
            asset-directory: dist/web-obfuscated/
            production-url: https://aura.allurx.io
