name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - dev

permissions:
    contents: read

concurrency:
    group: aura-ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            web_artifact_id: ${{ steps.web_artifact.outputs.artifact-id }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify project
              run: npm run verify

            - name: Validate Cloudflare configuration
              run: |
                  npm run deploy:preview -- --dry-run
                  npm run deploy:production -- --dry-run

            - name: Upload verified Web assets
              if: github.event_name == 'push'
              id: web_artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: aura-web-${{ github.run_id }}-${{ github.run_attempt }}
                  path: dist/
                  if-no-files-found: error
                  retention-days: 7

    deploy:
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        needs: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment:
            name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
            url: ${{ github.ref == 'refs/heads/main' && 'https://aura.allurx.io' || 'https://aura-preview.allurx.io' }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: npm

            - name: Install deployment dependencies
              run: npm ci

            - name: Download verified Web assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  artifact-ids: ${{ needs.verify.outputs.web_artifact_id }}
                  path: dist/
                  merge-multiple: true

            - name: Check deployment is still current
              id: current
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
                  if [[ "$branch_head" == "$GITHUB_SHA" ]]; then
                      echo "deploy=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "deploy=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Skipping deployment because the branch has a newer commit."
                  fi

            - name: Deploy verified Web assets
              if: steps.current.outputs.deploy == 'true'
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
              run: |
                  set -euo pipefail
                  if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
                      echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN before deploying."
                      exit 1
                  fi
                  npm run "deploy:$DEPLOY_ENVIRONMENT"
